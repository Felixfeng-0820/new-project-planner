name: check-skill

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate skill structure, metadata, links, and evals
        run: python3 scripts/validate_skill.py .

      - name: Check installer syntax
        run: bash -n install.sh

      - name: Test validator failure cases
        run: python3 scripts/test_validator.py

      - name: Test atomic installs, updates, rollback, and path safety
        run: python3 scripts/test_installer.py
